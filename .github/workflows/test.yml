name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
        python: ["3.8", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git --version
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: git surface --version

  # The oldest git the README promises (2.38) is older than any runner's, so run the suite in a
  # pinned image whose git is the nearest packaged one: Debian bookworm, git 2.39. The checkout
  # is mounted read-only; the same command runs locally (see CONTRIBUTING.md).
  old-git:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src -e PYTHONDONTWRITEBYTECODE=1
          python:3.8-slim-bookworm sh -c 'apt-get update -qq &&
          apt-get install -y -qq --no-install-recommends git >/dev/null &&
          git --version && python -m unittest discover -s tests -v'

  # The package PyPI would receive: built and checked on every change.
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
